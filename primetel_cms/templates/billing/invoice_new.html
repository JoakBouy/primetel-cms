{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "New Invoice" %}{% endblock %}
{% block page_header %}
<div class="mb-6"><h1 class="text-2xl font-bold text-slate-800">{% trans "New Invoice" %}</h1></div>
{% endblock %}
{% block content %}
<div class="max-w-md bg-white rounded-2xl border border-slate-100 shadow-card p-6">
    <form method="post" class="space-y-3">
        {% csrf_token %}
        <label class="block text-xs font-semibold text-slate-600">{% trans "Patient" %}</label>
        <select name="patient" required class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" id="invoice-patient">
            <option value="">{% trans "Select…" %}</option>
            {% for p in patients %}<option value="{{ p.pk }}" {% if selected_patient and selected_patient.pk == p.pk %}selected{% endif %}>{{ p.patient_number }} — {{ p.full_name }}</option>{% endfor %}
        </select>
        <button class="px-4 py-2 bg-primary-600 text-white text-sm rounded-xl" id="invoice-create">{% trans "Create" %}</button>
    </form>
</div>
{% endblock %}
