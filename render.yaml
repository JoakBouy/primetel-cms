services:
  - type: web
    name: primetel-cms
    env: python
    plan: free
    region: frankfurt
    rootDir: primetel_cms
    buildCommand: "pip install -r requirements.txt && python manage.py compile_locales && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_data && python manage.py bootstrap_admin"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      # Supabase Postgres session-pooler URL. Set via Render dashboard,
      # never commit. Format: postgresql://USER:PASS@HOST:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Comma-separated list. Update if you bind a custom domain.
      - key: ALLOWED_HOSTS
        value: primetel-cms-oz37.onrender.com,cms.primetel.tech
      # Idle session timeout in seconds (default 900 = 15 minutes).
      - key: IDLE_SESSION_SECONDS
        value: "900"
      # Proxies in front of the app that append to X-Forwarded-For. Render's
      # load balancer = 1. Add 1 if you put Cloudflare (proxied) in front.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Uploaded files (patient photos, attachments). Render's disk is wiped
      # on every deploy, so point these at a PRIVATE Supabase Storage bucket
      # (S3 compatible). Without them, uploads are lost on the next deploy.
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_ENDPOINT_URL
        sync: false
      - key: MEDIA_S3_REGION
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      # Admin "Factory reset" button. Keep false in production; set true only
      # for a deliberate pre-go-live wipe, then set it back.
      - key: ALLOW_FACTORY_RESET
        value: "false"
      # Optional: set to a Sentry DSN to enable error reporting.
      # Leave blank to disable (the prod settings handle this gracefully).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENV
        value: production
      # First-deploy admin bootstrap. Set BOOTSTRAP_ADMIN_PASSWORD in the
      # Render dashboard before the first build. Once the user exists,
      # subsequent builds leave the password untouched — change passwords
      # via /admin/, not by editing this env var.
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
